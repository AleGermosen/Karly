- id: de.b1.g27
  kind: grammar
  level: B1
  order: 27
  title_target: Formelles vs. informelles Register
  title_l1: Formal vs. informal register
  can_do: I can adjust my language between formal and informal contexts in both speech
    and writing.
  prereqs: []
  skill: grammar
  explain:
  - 'Formal address: Sie (always capitalized) with third-person plural verb forms.'
  - 'Informal address: du (singular), ihr (plural) — used with family, friends, peers
    of same age.'
  - Switching from du to Sie or vice versa is a social act — always follow the other
    person's lead.
  - 'Formal writing: complete sentences, Konjunktiv II for requests, no contractions,
    formal vocabulary.'
  - 'Informal speech: contractions (n'' for ein), du-form, direct questions, colloquial
    vocabulary.'
  - 'Emails: formal = Sehr geehrte/r …, Mit freundlichen Grüßen; informal = Hallo/Liebe/r,
    Viele Grüße.'
  - 'False friends of register: "Hey" or "Tschüss" in formal letters, or "Sehr geehrte"
    to a friend.'
  examples:
  - target: Könnten Sie mir bitte Ihre Kontaktdaten mitteilen? (formal)
    gloss: Could you please give me your contact details?
  - target: Kannst du mir deine Nummer geben? (informal)
    gloss: Can you give me your number?
  - target: Sehr geehrte Frau Müller, ich schreibe Ihnen bezüglich Ihres Angebots.
      (formal letter)
    gloss: Dear Ms Müller, I am writing to you regarding your offer.
  pitfalls:
  - English dropped formal "thou" long ago — German Sie/du distinction is still very
    much alive.
  - Don't capitalise "sie" (they/she) — only "Sie" (formal you) is capitalised in
    writing.
  - Using du with a stranger in Germany can be perceived as rude — err on the side
    of Sie.
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
