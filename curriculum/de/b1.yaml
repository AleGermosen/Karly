- id: de.b1.g28
  kind: grammar
  level: B1
  order: 28
  title_target: Vertiefung Lese- und Hörstrategien
  title_l1: Reading and listening comprehension strategies
  can_do: I can apply skimming, scanning, and inference strategies to understand German
    texts and audio.
  prereqs: []
  skill: grammar
  explain:
  - 'Skimming: read for the gist — look at headings, first sentences of paragraphs,
    keywords.'
  - 'Scanning: search for specific information — dates, names, numbers — without reading
    everything.'
  - 'Inference: use context, word-formation knowledge, and logic to guess unknown
    words.'
  - 'Cognates and near-cognates: Telefon, Musik, interessant — use English/Latin knowledge.'
  - 'Compound nouns: break them down — Handschuh = Hand + Schuh = hand + shoe = glove.'
  - 'Listening: focus on stressed words; function words can often be missed without
    losing meaning.'
  - Use the text's structure (topic sentence, examples, conclusion) to predict what
    comes next.
  examples:
  - target: Ich überfliege den Artikel zuerst, um das Thema zu verstehen.
    gloss: I skim the article first to understand the topic.
  - target: Beim Hören konzentriere ich mich auf die betonten Schlüsselwörter.
    gloss: When listening, I focus on the stressed key words.
  - target: Aus dem Kontext schließe ich, dass „Unwetter" ein schlimmes Wetter bedeutet.
    gloss: From the context I infer that "Unwetter" means bad weather.
  pitfalls:
  - Don't try to understand every word — focus on meaning and accept some ambiguity.
  - English speakers over-rely on vocabulary size; strategy use can compensate for
    unknown words.
  - Compound nouns look intimidating but are just two or more words joined — always
    break them down.
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
