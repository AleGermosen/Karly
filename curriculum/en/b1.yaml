- id: en.b1.g28
  kind: grammar
  level: B1
  order: 28
  title_target: Emphasis — do/does/did and cleft sentences
  title_l1: Énfasis — do/does/did y oraciones escindidas
  can_do: I can add emphasis to a statement using emphatic do and cleft structures.
  prereqs:
  - en.b1.g21
  - en.b1.g22
  skill: grammar
  explain:
  - 'Emphatic do/does/did: add stress to contradict or insist. ''I DO like it!'' /
    ''She DID call you.'''
  - 'Used to contradict a negative assumption: ''You never listen!'' — ''I DO listen!'''
  - 'Cleft sentences beginning with ''It'': ''It was Maria who called.'' (not someone
    else)'
  - 'Structure: It + be + emphasised element + who/that + rest of sentence.'
  - '''It was the noise that woke me up.'' (not the light, not the alarm — the noise)'
  - 'What-clefts: ''What I need is a holiday.'' / ''What surprised me was her reaction.'''
  - 'Structure: What + clause + be + emphasised element.'
  - All of these are about highlighting one element of a sentence — they imply a contrast
    with other possibilities.
  examples:
  - target: I do understand your point — I just disagree with it.
    gloss: Sí entiendo tu punto — simplemente no estoy de acuerdo.
  - target: It was the manager who made the final decision, not me.
    gloss: Fue el gerente quien tomó la decisión final, no yo.
  - target: What I enjoy most about this job is the variety.
    gloss: Lo que más me gusta de este trabajo es la variedad.
  pitfalls:
  - Emphatic 'do' only works in the present simple (do/does) and past simple (did).
    Not with other auxiliaries.
  - Cleft sentences sound unnatural if overused — save them for genuine emphasis or
    contrast.
  - Spanish uses intonation for emphasis where English uses these structures. Learning
    to use them makes your English sound more natural and less flat.
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
