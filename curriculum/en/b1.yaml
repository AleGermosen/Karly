- id: en.b1.g26
  kind: grammar
  level: B1
  order: 26
  title_target: So and such
  title_l1: So y such
  can_do: I can use so and such to add emphasis and express strong reactions.
  prereqs:
  - en.a2.g15
  skill: grammar
  explain:
  - 'so + adjective/adverb: ''The food was so good!'' / ''She speaks so clearly.'''
  - 'such + (a/an) + (adjective) + noun: ''It was such a good film!'' / ''They''re
    such nice people!'''
  - 'so...that / such...that: expresses a result. ''It was so cold that we stayed
    inside.'''
  - '''She''s such a good teacher that everyone loves her class.'''
  - 'so much / so many: ''There was so much food!'' / ''There were so many people!'''
  - 'such a lot of: ''There was such a lot of noise.'' (informal alternative)'
  - 'Rule: so before adjectives and adverbs; such before nouns (with or without adjective).'
  examples:
  - target: The exam was so difficult that half the class failed.
    gloss: El examen era tan difícil que la mitad de la clase suspendió.
  - target: She has such talent — everything she makes is beautiful.
    gloss: Tiene tanto talento — todo lo que hace es hermoso.
  - target: I had so much fun at the party — I didn't want to leave.
    gloss: Me lo pasé tan bien en la fiesta que no quería irme.
  pitfalls:
  - 'Don''t mix so/such: ''She is so a nice person'' — wrong. Before nouns, use ''such'':
    ''such a nice person.'''
  - '''Such'' needs ''a/an'' before singular countable nouns: ''such a good idea''
    not ''such good idea''.'
  - 'Plurals and uncountables drop the article: ''such nice people'', ''such good
    advice''.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
