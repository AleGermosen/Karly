- id: en.b1.g27
  kind: grammar
  level: B1
  order: 27
  title_target: Adjective and noun patterns
  title_l1: Patrones con adjetivos y sustantivos
  can_do: I can use common adjective and noun collocations correctly with the right
    preposition.
  prereqs:
  - en.a2.g12
  skill: grammar
  explain:
  - Many adjectives and nouns are followed by fixed prepositions — these must be memorised.
  - 'Key adjective + preposition pairs: afraid of, good at, interested in, proud of,
    responsible for, tired of, excited about, famous for.'
  - 'More pairs: angry about/with, bored with/by, fond of, keen on, satisfied with,
    surprised at/by, worried about.'
  - 'Noun + preposition: advantage of, belief in, cause of, demand for, effect on,
    improvement in, interest in, lack of, reason for, solution to.'
  - 'When a verb follows, it takes -ing: ''She''s afraid of flying.'' / ''I''m interested
    in learning.'''
  - These are fixed phrases — the preposition doesn't change based on logic, only
    convention.
  - Learning them in context (sentences, not lists) is more effective.
  examples:
  - target: She's very good at maths but she's not interested in languages.
    gloss: Se le dan muy bien las matemáticas, pero no le interesan los idiomas.
  - target: He's been worried about losing his job for months.
    gloss: Lleva meses preocupado por perder su trabajo.
  - target: There's no easy solution to the problem of traffic in the city.
    gloss: No hay una solución fácil al problema del tráfico en la ciudad.
  pitfalls:
  - Prepositions don't translate — 'good at' is 'bueno en' in Spanish but 'bueno para'
    could also work. Always learn the English preposition directly.
  - 'Don''t add extra prepositions: ''interested in to learn'' — wrong. ''interested
    in learning.'''
  - 'A few adjectives take different prepositions with different meanings: ''angry
    about something'' (situation) vs ''angry with someone'' (person).'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
