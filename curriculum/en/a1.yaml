- id: en.a1.g15
  kind: grammar
  level: A1
  order: 15
  title_target: Imperatives
  title_l1: Imperativos
  can_do: I can give instructions and directions.
  prereqs:
  - en.a1.g03
  skill: grammar
  explain:
  - Imperatives give orders, instructions, directions, or advice.
  - 'Form: just use the base verb — no subject. Open the door. Sit down. Be quiet.'
  - 'Negative: Don''t + base verb. Don''t run. Don''t be late.'
  - 'Polite forms: add ''please'' at the start or end. Please sit down. / Sit down,
    please.'
  - 'Inclusive ''Let''s'': Let''s go! Let''s eat! — invites the speaker too.'
  - 'Negative Let''s: Let''s not be late.'
  examples:
  - target: Turn left at the traffic light, then go straight on.
    gloss: Gira a la izquierda en el semáforo, luego sigue recto.
  - target: Don't touch that — it's hot!
    gloss: ¡No toques eso, está caliente!
  - target: Let's take a break — we've been studying for two hours.
    gloss: Tomemos un descanso, llevamos dos horas estudiando.
  pitfalls:
  - Spanish imperatives change form for tú/usted/ustedes; English has only one form
    for everyone.
  - 'Don''t add a subject: ''You open the door'' is a statement; ''Open the door''
    is an order.'
  - '''Let''s'' = ''Let us'' — it always includes the speaker. For someone else: ''Let
    him go.'''
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:3ed6d1c1c3df87b6
- id: en.a1.g16
  kind: grammar
  level: A1
  order: 16
  title_target: Past simple — to be (was / were)
  title_l1: Pasado simple — to be (was / were)
  can_do: I can talk about the past state of people and things.
  prereqs:
  - en.a1.g01
  skill: grammar
  explain:
  - 'Past of ''to be'': was (I / he / she / it) and were (you / we / they).'
  - 'Affirmative: I was tired. She was at home. They were happy.'
  - 'Negative: I wasn''t hungry. We weren''t late. (was not / were not)'
  - 'Question: Was he at school? Were you there? — Yes, I was. / No, we weren''t.'
  - 'Time markers for past: yesterday, last night, last week, in 2020, ago.'
  examples:
  - target: I was born in 1995 in Santiago.
    gloss: Nací en 1995 en Santiago.
  - target: The film wasn't very good — it was boring.
    gloss: La película no fue muy buena, fue aburrida.
  - target: Were you and Carlos at the party? — Yes, we were.
    gloss: ¿Tú y Carlos estuvieron en la fiesta? — Sí.
  pitfalls:
  - '''Was'' is only for I/he/she/it. A common error: ''They was late'' — should be
    ''They were late''.'
  - 'Question word order: ''Was he…?'' not ''He was…?'' with a question mark.'
  - Spanish uses 'era/estuvo' for was/were; English just uses was/were for both ser
    and estar.
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:7548a6ae10f1b49b
- id: en.a1.g17
  kind: grammar
  level: A1
  order: 17
  title_target: Past simple — regular verbs
  title_l1: Pasado simple — verbos regulares
  can_do: I can tell a simple story about the past.
  prereqs:
  - en.a1.g16
  skill: grammar
  explain:
  - 'Regular past tense: add -ed to the base verb. work → worked. play → played.'
  - 'Spelling rules: silent -e → just add -d (live → lived). Consonant + y → -ied
    (study → studied).'
  - 'Double the final consonant for short stressed CVC verbs: stop → stopped, plan
    → planned.'
  - 'Negative: didn''t + base verb. She didn''t work yesterday. (NOT didn''t worked)'
  - 'Question: Did + subject + base verb. Did you call him? — Yes, I did. / No, I
    didn''t.'
  - All persons use the same -ed form — no third-person -s in the past.
  examples:
  - target: I worked all morning and finished the report.
    gloss: Trabajé toda la mañana y terminé el informe.
  - target: She didn't study last night — she watched a film.
    gloss: No estudió anoche, vio una película.
  - target: Did they arrive on time? — Yes, they arrived at nine.
    gloss: ¿Llegaron a tiempo? — Sí, llegaron a las nueve.
  pitfalls:
  - 'After ''didn''t'' the verb must be in base form: ''She didn''t worked'' is wrong.'
  - 'No ''s'' in past questions: ''Did she works?'' is wrong — ''Did she work?'''
  - '-ed is not always pronounced the same: worked = /t/, played = /d/, wanted = /ɪd/.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:9f8203194c46a86e
- id: en.a1.g18
  kind: grammar
  level: A1
  order: 18
  title_target: Past simple — common irregular verbs
  title_l1: Pasado simple — verbos irregulares comunes
  can_do: I can talk about past events using common irregular verbs.
  prereqs:
  - en.a1.g17
  skill: grammar
  explain:
  - Irregular verbs don't add -ed. Each one has its own past form to memorise.
  - 'Essential A1 irregulars: go → went, have → had, do → did, say → said, get → got.'
  - 'More: come → came, see → saw, know → knew, give → gave, take → took, eat → ate.'
  - 'These forms are only for affirmative: She went home. They had lunch.'
  - In negatives and questions, use 'didn't/did' + base form (as with regular verbs).
  - She didn't go. (NOT didn't went) / Did you see it? (NOT Did you saw it?)
  examples:
  - target: We went to the beach and had a great time.
    gloss: Fuimos a la playa y lo pasamos muy bien.
  - target: I didn't see him — did you?
    gloss: Yo no lo vi, ¿tú sí?
  - target: She gave me her number but I lost it.
    gloss: Me dio su número pero lo perdí.
  pitfalls:
  - 'Never use the past form after ''didn''t'': ''I didn''t went'' is wrong — ''I
    didn''t go''.'
  - '''Did you saw?'' is wrong — ''Did you see?'' The question auxiliary carries the
    tense.'
  - The past form is only for affirmatives. Memorise affirmatives, then negatives/questions
    follow the rule.
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:70123fb8d4566726
- id: en.a1.g19
  kind: grammar
  level: A1
  order: 19
  title_target: Like / love / hate + -ing
  title_l1: Like / love / hate + infinitivo o gerundio
  can_do: I can say what activities I enjoy or dislike.
  prereqs:
  - en.a1.g03
  skill: grammar
  explain:
  - After 'like', 'love', 'hate', 'enjoy', and 'don't mind', use the -ing form of
    a verb.
  - I like reading. She loves dancing. He hates waiting.
  - You can also use 'like + to + infinitive' for habit/preference, but -ing is more
    common.
  - 'Negative: I don''t like cooking. She doesn''t enjoy travelling.'
  - 'Question: Do you like swimming? — Yes, I love it. / No, I can''t stand it.'
  - '''Can''t stand'' and ''don''t mind'' also take -ing: I can''t stand waiting.
    I don''t mind helping.'
  examples:
  - target: I love watching films but I hate cleaning the house.
    gloss: Me encanta ver películas pero odio limpiar la casa.
  - target: Does she enjoy cooking? — Yes, she loves it.
    gloss: ¿Le gusta cocinar? — Sí, le encanta.
  - target: I don't mind working late if it's necessary.
    gloss: No me importa trabajar hasta tarde si es necesario.
  pitfalls:
  - 'Spanish often uses the infinitive after gustar/amar: ''Me gusta estudiar'' →
    English needs -ing: ''I like studying''.'
  - 'Don''t use the base verb: ''I like swim'' is wrong — ''I like swimming''.'
  - '''Enjoy'' always takes -ing; ''enjoy to swim'' is wrong in standard English.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:ee77de3efe2c44df
- id: en.a1.g20
  kind: grammar
  level: A1
  order: 20
  title_target: 'Countable and uncountable nouns: some, any, much, many'
  title_l1: 'Sustantivos contables e incontables: some, any, much, many'
  can_do: I can talk about quantities of things.
  prereqs:
  - en.a1.g05
  skill: grammar
  explain:
  - 'Countable nouns have a plural: an apple / apples, a chair / chairs.'
  - 'Uncountable nouns have no plural and need no article: water, money, rice, information,
    advice.'
  - '''Some'' (affirmative) and ''any'' (negatives and questions) work for both types.'
  - 'For countable plurals: many, not many, a lot of. How many students are there?'
  - 'For uncountable: much, not much, a lot of. How much water do you drink?'
  - '''A few'' = a small number (countable). ''A little'' = a small amount (uncountable).'
  examples:
  - target: There's some milk in the fridge but there isn't any bread.
    gloss: Hay leche en el refrigerador pero no hay pan.
  - target: How many students are in your class? — About twenty.
    gloss: ¿Cuántos estudiantes hay en tu clase? — Unos veinte.
  - target: I have a little money but not much time.
    gloss: Tengo algo de dinero pero no mucho tiempo.
  pitfalls:
  - Spanish 'información' is countable; English 'information' is not. No 'informations'.
  - Use 'how many' with countable, 'how much' with uncountable — mixing them sounds
    very wrong.
  - '''Some'' in questions makes an offer or request: ''Would you like some coffee?''
    sounds polite; ''Do you have any coffee?'' is a neutral question.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:7c33c03b73b60816
