- id: en.a1.g01
  kind: grammar
  level: A1
  order: 1
  title_target: The verb to be — present simple
  title_l1: El verbo to be — presente simple
  can_do: I can introduce myself and say where I am from.
  prereqs: []
  skill: grammar
  explain:
  - 'The verb ''to be'' has three forms in the present: am, is, are.'
  - 'Use am only with I: I am a student. → Soy estudiante.'
  - 'Use is with he, she, it: She is my teacher. → Ella es mi profesora.'
  - 'Use are with you, we, they: They are from Mexico. → Son de México.'
  - 'Short forms (contractions) are normal in speech: I''m, you''re, he''s, she''s,
    it''s, we''re, they''re.'
  - 'Negative: add ''not'' after the verb. I am not tired. / She isn''t here.'
  - 'Question: move ''to be'' before the subject. Are you ready? / Is he a doctor?'
  examples:
  - target: I'm from the Dominican Republic.
    gloss: Soy de la República Dominicana.
  - target: She isn't my sister — she's my cousin.
    gloss: No es mi hermana, es mi prima.
  - target: Are you and Carlos students?
    gloss: ¿Ustedes y Carlos son estudiantes?
  pitfalls:
  - Spanish has ser and estar; English 'to be' covers both. 'I'm tired' (estar) and
    'I'm a doctor' (ser) use the same verb.
  - 'Never drop the subject: Spanish ''Soy estudiante'' becomes ''I am a student'',
    not just ''Am a student''.'
  - 'In questions the subject and verb switch order: ''Are you…?'' NOT ''You are…?''
    with a question mark.'
  - '''It'' is used for things, animals and weather: ''It is cold today.'' Spanish
    speakers often skip it.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:e49613a43b5e0fd6
- id: en.a1.g02
  kind: grammar
  level: A1
  order: 2
  title_target: 'Articles: a, an, the'
  title_l1: 'Los artículos: a, an, the'
  can_do: I can talk about people and things, saying whether they are new or known.
  prereqs:
  - en.a1.g01
  skill: grammar
  explain:
  - '''A'' and ''an'' are indefinite articles — use them the first time you mention
    something.'
  - 'Use ''a'' before consonant sounds: a book, a university (sounds like ''yoo'').'
  - 'Use ''an'' before vowel sounds: an apple, an hour (the h is silent).'
  - '''The'' is the definite article — use it when the listener already knows which
    one you mean.'
  - 'Use ''the'' the second time you mention something: I have a dog. The dog is big.'
  - 'No article with general plural nouns: ''Dogs are friendly.'' NOT ''The dogs are
    friendly.'''
  - 'No article with most names: ''I live in Santo Domingo.'' NOT ''I live in the
    Santo Domingo.'''
  examples:
  - target: I saw a film last night. The film was great.
    gloss: Vi una película anoche. La película estuvo genial.
  - target: Can I have an orange, please?
    gloss: ¿Me da una naranja, por favor?
  - target: Teachers need patience.
    gloss: Los maestros necesitan paciencia. (general — no article in English)
  pitfalls:
  - 'Spanish always uses articles with general nouns: ''Los perros son amigables.''
    English drops the article: ''Dogs are friendly.'''
  - It depends on the sound, not the letter. 'An honest man' — h is silent. 'A university'
    — sounds like 'you'.
  - 'Countries and cities take no article: France, Paris, Mexico. A few exceptions:
    the United States, the Dominican Republic.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:5469e12f4dcb061b
- id: en.a1.g03
  kind: grammar
  level: A1
  order: 3
  title_target: Present simple — affirmative and negative
  title_l1: Presente simple — afirmativo y negativo
  can_do: I can describe habits, routines and facts.
  prereqs:
  - en.a1.g01
  skill: grammar
  explain:
  - Use the present simple for habits, routines, and facts that are always true.
  - 'Base form for I / you / we / they: I work, you live, we study.'
  - 'Add -s for he / she / it: he works, she lives, it costs.'
  - 'Spelling rules: add -es after -s, -sh, -ch, -x, -o (washes, goes). Drop -y →
    -ies (study → studies).'
  - 'Negative: use do not / does not + base form. I don''t like coffee. She doesn''t
    work here.'
  - '''Does'' is used with he/she/it in negatives and questions — the main verb goes
    back to base form.'
  - 'Time markers: every day, always, usually, never, on Mondays, in the morning.'
  examples:
  - target: My brother works in a hospital.
    gloss: Mi hermano trabaja en un hospital.
  - target: I don't drink coffee — I prefer tea.
    gloss: No tomo café, prefiero el té.
  - target: She studies English every evening.
    gloss: Ella estudia inglés todas las tardes.
  pitfalls:
  - 'Never add -s to I / you / we / they: ''They works here'' is wrong — ''They work
    here''.'
  - 'In negatives with he/she/it: ''She doesn''t works'' is wrong — ''She doesn''t
    work''.'
  - 'Spanish speakers often omit the subject: ''Trabaja en un hospital.'' In English
    the subject is required: ''He works in a hospital.'''
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:46fb922a40a42167
- id: en.a1.g04
  kind: grammar
  level: A1
  order: 4
  title_target: Present simple — questions and short answers
  title_l1: Presente simple — preguntas y respuestas cortas
  can_do: I can ask and answer basic questions about daily life.
  prereqs:
  - en.a1.g03
  skill: grammar
  explain:
  - 'Yes/no questions: Do / Does + subject + base verb. Do you like music? Does she
    live here?'
  - 'Short answer: Yes, I do. / No, she doesn''t. Never ''Yes, I like.'' or ''No,
    she doesn''t likes.'''
  - 'Wh- questions put the question word first: What, Where, When, Why, Who, How.'
  - 'Wh- + do/does + subject + verb: Where do you live? What does he do?'
  - 'When ''who'' or ''what'' is the subject, there is no do/does: Who lives here?
    What happens next?'
  - 'Intonation: yes/no questions rise at the end; wh- questions fall.'
  examples:
  - target: Do you have a pen? — Yes, I do.
    gloss: ¿Tienes un bolígrafo? — Sí, tengo.
  - target: What does your sister do? — She's a nurse.
    gloss: ¿A qué se dedica tu hermana? — Es enfermera.
  - target: Where do they study? — At the university.
    gloss: ¿Dónde estudian? — En la universidad.
  pitfalls:
  - '''Do you like?'' not ''Like you?'' — English uses an auxiliary; Spanish changes
    word order without one.'
  - 'Short answers use the auxiliary, not the main verb: ''Yes, I do'' NOT ''Yes,
    I like.'''
  - '''Does he works?'' is wrong — the base form must be used: ''Does he work?'''
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:b9c2ddd47b0db306
- id: en.a1.g05
  kind: grammar
  level: A1
  order: 5
  title_target: Plural nouns and this / that / these / those
  title_l1: Sustantivos en plural y this / that / these / those
  can_do: I can point at things and talk about more than one.
  prereqs:
  - en.a1.g02
  skill: grammar
  explain:
  - 'Most plurals: add -s. book → books, student → students.'
  - 'After -s, -sh, -ch, -x, -z add -es: bus → buses, watch → watches.'
  - 'Consonant + -y → -ies: city → cities, baby → babies.'
  - 'Common irregular plurals: man/men, woman/women, child/children, person/people,
    foot/feet.'
  - '''This'' (singular near) / ''that'' (singular far): This book is mine. That car
    is big.'
  - '''These'' (plural near) / ''those'' (plural far): These shoes are new. Those
    students are great.'
  - 'This/that/these/those can stand alone: ''What is this?'' / ''Those are my keys.'''
  examples:
  - target: These children are my students.
    gloss: Estos niños son mis estudiantes.
  - target: That woman is my neighbour.
    gloss: Esa mujer es mi vecina.
  - target: How much are those shoes?
    gloss: ¿Cuánto cuestan esos zapatos?
  pitfalls:
  - 'People is already plural: ''Many people are here.'' NOT ''Many peoples are here.'''
  - '''Informations'', ''advices'', ''furnitures'' are wrong in English — these nouns
    have no plural form.'
  - Don't confuse 'this is' (introducing something) with 'it is' (referring to something
    already known).
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:510e31937473c198
- id: en.a1.g06
  kind: grammar
  level: A1
  order: 6
  title_target: Present continuous
  title_l1: Presente continuo
  can_do: I can say what is happening right now.
  prereqs:
  - en.a1.g03
  skill: grammar
  explain:
  - Use the present continuous for actions happening right now, at this moment.
  - 'Form: subject + am/is/are + verb-ing. I am working. She is reading.'
  - 'Spelling: most verbs just add -ing (work → working, study → studying).'
  - 'Drop silent -e before adding -ing: write → writing, come → coming.'
  - 'Double the final consonant for short stressed verbs: sit → sitting, run → running.'
  - 'Negative: am/is/are + not + -ing. He isn''t sleeping.'
  - 'Question: move am/is/are before the subject. Are you listening?'
  - 'Time markers: now, at the moment, right now, today, this week.'
  examples:
  - target: I'm studying English right now.
    gloss: Estoy estudiando inglés ahora mismo.
  - target: She isn't watching TV — she's reading.
    gloss: No está viendo la televisión, está leyendo.
  - target: What are you doing at the moment?
    gloss: ¿Qué estás haciendo en este momento?
  pitfalls:
  - Spanish uses the present simple more broadly; English uses the continuous for
    right-now actions.
  - 'Some verbs rarely take -ing: know, want, like, love, need, understand. Say ''I
    know'' not ''I am knowing''.'
  - 'Don''t forget the auxiliary: ''She reading'' is wrong — ''She is reading''.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:4e6256a71a5e7580
- id: en.a1.g07
  kind: grammar
  level: A1
  order: 7
  title_target: There is / There are
  title_l1: Hay — there is / there are
  can_do: I can describe a place and say what is in it.
  prereqs:
  - en.a1.g05
  skill: grammar
  explain:
  - '''There is'' describes one thing; ''There are'' describes two or more.'
  - There is a cat on the sofa. There are three books on the table.
  - 'Negative: There isn''t a cat. / There aren''t any chairs.'
  - 'Question: Is there a bank near here? / Are there any students?'
  - '''Any'' is used in negatives and questions with countable plurals: Are there
    any questions?'
  - '''Some'' is used in affirmative sentences: There are some apples.'
  - Both Spanish 'hay' and English 'there is/are' introduce new information.
  examples:
  - target: There's a supermarket on this street.
    gloss: Hay un supermercado en esta calle.
  - target: There aren't any chairs in the room.
    gloss: No hay sillas en la habitación.
  - target: Is there a bus stop near here? — Yes, there is.
    gloss: ¿Hay una parada de autobús cerca? — Sí.
  pitfalls:
  - Spanish 'hay' works for both singular and plural; English requires is/are to match
    the noun.
  - Don't confuse 'There is' (existence) with 'It is' (description of something already
    known).
  - In fast speech 'There is' contracts to 'There's', but 'There are' rarely contracts
    in writing.
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:578924377f7c821d
- id: en.a1.g08
  kind: grammar
  level: A1
  order: 8
  title_target: Have got / have
  title_l1: Tener — have got / have
  can_do: I can talk about what I own and what I possess.
  prereqs:
  - en.a1.g03
  skill: grammar
  explain:
  - '''Have got'' and ''have'' both mean tener. ''Have got'' is more common in spoken
    British English.'
  - 'Affirmative: I have got / I''ve got a car. OR I have a car.'
  - 'Negative: I haven''t got a car. / I don''t have a car.'
  - 'Question: Have you got a pen? / Do you have a pen?'
  - 'With he/she/it: She has got / She''s got a dog. / She has a dog.'
  - 'Negative (he/she/it): She hasn''t got / She doesn''t have.'
  - 'Never mix the two: say ''Have you got?'' OR ''Do you have?'' — not ''Do you have
    got?'''
  examples:
  - target: I've got two sisters and a brother.
    gloss: Tengo dos hermanas y un hermano.
  - target: He hasn't got a car — he takes the bus.
    gloss: No tiene carro, toma el autobús.
  - target: Do you have the time? — Yes, it's three o'clock.
    gloss: ¿Tienes la hora? — Sí, son las tres.
  pitfalls:
  - 'Spanish ''tener'' = English ''have/have got''. Don''t translate as ''to be'':
    ''I am hungry'' not ''I have hunger''.'
  - '''Have got'' doesn''t have a past tense — use ''had'': ''Yesterday I had a cold'',
    not ''I had got''.'
  - 'In questions: ''Have you got?'' (British) and ''Do you have?'' (American/International)
    are both correct.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:ddb850971709ae15
- id: en.a1.g09
  kind: grammar
  level: A1
  order: 9
  title_target: Can / can't — ability and permission
  title_l1: Can / can't — habilidad y permiso
  can_do: I can say what I am able to do and ask for permission.
  prereqs:
  - en.a1.g01
  skill: grammar
  explain:
  - '''Can'' expresses ability (being able to do something) and permission (being
    allowed to).'
  - 'Form: subject + can + base verb (no -s, no to). She can swim. NOT She cans swim.'
  - 'Negative: can''t (cannot). I can''t drive. He can''t come today.'
  - 'Question: Can you cook? — Yes, I can. / No, I can''t.'
  - 'Permission: Can I open the window? — Yes, of course. / Sorry, you can''t.'
  - 'There is no do/does in can sentences: ''Does she can?'' is wrong — ''Can she?'''
  examples:
  - target: I can speak Spanish and English.
    gloss: Puedo hablar español e inglés.
  - target: She can't drive — she's only sixteen.
    gloss: No puede manejar, solo tiene dieciséis años.
  - target: Can I use your phone? — Sure!
    gloss: ¿Puedo usar tu teléfono? — ¡Claro!
  pitfalls:
  - 'Never add -s: ''She can'', not ''She cans''. Modal verbs have no third-person
    ending.'
  - 'Never add ''to'': ''I can swim'', not ''I can to swim''.'
  - 'Ability past tense: ''could''. Permission past (story): ''could'' or ''was allowed
    to''.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:5fd24f6d71bda63b
- id: en.a1.g10
  kind: grammar
  level: A1
  order: 10
  title_target: Object pronouns
  title_l1: Pronombres de objeto
  can_do: I can refer to people and things without repeating their name.
  prereqs:
  - en.a1.g01
  skill: grammar
  explain:
  - 'Object pronouns replace nouns that receive the action: me, you, him, her, it,
    us, them.'
  - 'Subject → Object: I → me, he → him, she → her, we → us, they → them.'
  - '''You'' and ''it'' are the same as subject forms.'
  - 'Object pronouns come after verbs: I like her. She called me. Can you help us?'
  - 'They also come after prepositions: This is for you. He sat next to her. Come
    with us.'
  - 'Spanish speakers: ''him'' and ''her'' are the same word ''lo/la'' in Spanish
    but different in English.'
  examples:
  - target: I called her but she didn't answer me.
    gloss: La llamé pero no me contestó.
  - target: This gift is for them — please give it to them.
    gloss: Este regalo es para ellos, por favor dáselo.
  - target: Can you help us? We don't understand it.
    gloss: ¿Nos pueden ayudar? No lo entendemos.
  pitfalls:
  - 'After ''between'': always use object pronouns. ''Between you and me'' (not ''between
    you and I'').'
  - 'Don''t use subject pronouns after verbs: ''Call he'' is wrong — ''Call him''.'
  - '''Him'' = male person; ''her'' = female person; ''it'' = thing or animal (usually).
    Don''t mix them up.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:915151d05c39d9ce
- id: en.a1.g11
  kind: grammar
  level: A1
  order: 11
  title_target: 'Possessives: adjectives and ''s'
  title_l1: 'Posesivos: adjetivos y apóstrofo s'
  can_do: I can say who things belong to.
  prereqs:
  - en.a1.g10
  skill: grammar
  explain:
  - 'Possessive adjectives show belonging: my, your, his, her, its, our, their.'
  - 'They come before a noun and never change: my book, my books (not mys books).'
  - 'Possessive ''s: add apostrophe + s to a name or noun. María''s bag. The teacher''s
    desk.'
  - 'If the noun ends in -s, add just the apostrophe or ''s: James'' car OR James''s
    car.'
  - 'Don''t confuse ''its'' (possessive) and ''it''s'' (it is): The cat licked its
    paw. It''s cold today.'
  - '''Whose'' asks about possession: Whose bag is this? — It''s mine.'
  - 'Independent possessives (no noun): mine, yours, his, hers, ours, theirs.'
  examples:
  - target: This is my phone. Is that yours?
    gloss: Este es mi teléfono. ¿Es el tuyo?
  - target: Pedro's sister is a doctor.
    gloss: La hermana de Pedro es médica.
  - target: The dog wagged its tail.
    gloss: El perro movió la cola.
  pitfalls:
  - 'Its (possessive) vs it''s (it is): the apostrophe REMOVES a letter, it doesn''t
    show possession.'
  - 'Their / there / they''re — three different words: their (possessive), there (place),
    they''re (they are).'
  - 'Don''t add a noun after mine/yours/his/hers: ''It''s mine'' not ''It''s my''
    or ''It''s mine book''.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:7880b60e681b74e9
- id: en.a1.g12
  kind: grammar
  level: A1
  order: 12
  title_target: Prepositions of place
  title_l1: Preposiciones de lugar
  can_do: I can describe where things are.
  prereqs:
  - en.a1.g07
  skill: grammar
  explain:
  - 'in — inside a space: in the box, in the bag, in the room, in Spain.'
  - 'on — on a surface: on the table, on the wall, on the floor, on the bus.'
  - 'at — at a specific point or place: at the bus stop, at school, at home, at work.'
  - 'next to / beside — touching or very close: next to the door.'
  - 'between — in the middle of two things: between the bank and the café.'
  - 'in front of / behind: the park is in front of the hotel. The car is behind the
    house.'
  - above / below / under / over are also common at A1.
  examples:
  - target: My keys are on the table, next to the phone.
    gloss: Mis llaves están sobre la mesa, al lado del teléfono.
  - target: The school is between the park and the supermarket.
    gloss: La escuela está entre el parque y el supermercado.
  - target: She's at home — not at work today.
    gloss: Está en casa, no en el trabajo hoy.
  pitfalls:
  - Spanish uses 'en' for in/on/at; English uses three different prepositions depending
    on context.
  - '''In'' for enclosed spaces and countries/cities; ''on'' for surfaces and transport
    (on the bus).'
  - '''At'' for specific points or institutions: at school, at the station, at the
    corner.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:7021230693ee678e
- id: en.a1.g13
  kind: grammar
  level: A1
  order: 13
  title_target: Prepositions of time
  title_l1: Preposiciones de tiempo
  can_do: I can say when things happen.
  prereqs:
  - en.a1.g04
  skill: grammar
  explain:
  - 'at — for clock times and fixed points: at 8 o''clock, at noon, at night, at the
    weekend.'
  - 'in — for months, years, seasons, and parts of the day: in July, in 2020, in the
    morning.'
  - 'on — for days and dates: on Monday, on my birthday, on 15th March.'
  - 'A simple rule: at (clock) → in (longer period) → on (specific day).'
  - 'No preposition with ''last'', ''next'', ''this'', ''every'': last week, next
    Monday, every day.'
  - 'For / since: for + duration (for two hours); since + start point (since 9 o''clock).'
  examples:
  - target: The class starts at nine on Monday mornings.
    gloss: La clase empieza a las nueve los lunes por la mañana.
  - target: She was born in July, in 1998.
    gloss: Nació en julio de 1998.
  - target: I'll see you next Friday — not this week.
    gloss: Te veo el próximo viernes, no esta semana.
  pitfalls:
  - Spanish uses 'el lunes / los lunes' but English uses 'on Monday' or 'on Mondays'.
  - 'No preposition before ''last/next/this/every'': ''on next Monday'' is wrong —
    just ''next Monday''.'
  - '''In the morning'' but ''at night'' — English is inconsistent here. Both must
    be memorised.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
  spine_hash: sha256:5f83dee40fbc62af
- id: en.a1.g14
  kind: grammar
  level: A1
  order: 14
  title_target: Adverbs of frequency
  title_l1: Adverbios de frecuencia
  can_do: I can say how often I do things.
  prereqs:
  - en.a1.g03
  skill: grammar
  explain:
  - 'Adverbs of frequency: always (100%), usually, often, sometimes, rarely, never
    (0%).'
  - 'Position: they go BEFORE the main verb. I always eat breakfast. She never drinks
    coffee.'
  - 'Exception: with ''to be'', adverbs of frequency go AFTER the verb. He is always
    late.'
  - 'You can also use: every day, once a week, twice a month, three times a year —
    at the end.'
  - '''How often?'' asks about frequency. ''How often do you exercise? — Three times
    a week.'''
  examples:
  - target: I usually wake up at seven, but on Sundays I always sleep late.
    gloss: Normalmente me despierto a las siete, pero los domingos siempre duermo
      hasta tarde.
  - target: She is rarely late for class.
    gloss: Rara vez llega tarde a clase.
  - target: How often do you visit your family? — Once a month.
    gloss: ¿Con qué frecuencia visitas a tu familia? — Una vez al mes.
  pitfalls:
  - 'Don''t put the adverb at the end with main verbs: ''I eat always breakfast''
    is wrong.'
  - 'With ''to be'' the adverb comes after: ''He is always tired'', not ''He always
    is tired''.'
  - '''Rarely'' and ''seldom'' are already negative — don''t add ''not'': ''She rarely
    doesn''t come'' is wrong.'
  exercises:
  - type: mcq
    n: 5
  - type: cloze
    n: 5
  - type: transform
    n: 2
  - type: produce
    n: 2
